# Keyboard layout
input type:keyboard {
    xkb_layout es
}

# Wallpaper
output * bg /usr/local/share/backgrounds/wallpaper.png fill

# Autostart: status bar, notifications, authentication agent and automounting of USB drives
bar bar-0 mode invisible
exec waybar
exec mako
exec lxpolkit
exec udiskie
# Refresh the volume and microphone modules (and their device tooltips) whenever PipeWire changes
exec bash -c 'while :; do pw-mon | while read -r _; do while read -t 0.2 -r _; do :; done; pkill -RTMIN+8 waybar; pkill -RTMIN+9 waybar; done; sleep 2; done'

# Windows: thin border, no title bars
default_border pixel 1
default_floating_border pixel 1
client.focused          #7aa2f7 #7aa2f7 #e0e6f7 #7aa2f7 #7aa2f7
client.focused_inactive #33467c #33467c #a9b1d6 #33467c #33467c
client.unfocused        #33467c #1a1b26 #565f89 #33467c #33467c
client.urgent           #f7768e #f7768e #1a1b26 #f7768e #f7768e

# Small gap between windows
gaps inner 7

# Clipboard history: Mod+Shift+v opens it in the launcher
exec wl-paste --watch cliphist store
bindsym $mod+Shift+v exec cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Launcher: fuzzel instead of wmenu on Mod+d
unbindsym $mod+d
bindsym $mod+d exec fuzzel

# Screen lock: Mod+Escape, and automatically before suspending (no lock on inactivity)
bindsym $mod+Escape exec swaylock
exec swayidle -w before-sleep 'swaylock -f'

# Screenshot: Print selects an area, saves it in ~/Pictures and copies it to the clipboard
unbindsym Print
bindsym Print exec sh -c 'f=~/Pictures/screenshot_$(date +%F_%H-%M-%S).png; mkdir -p ~/Pictures; grim -g "$(slurp)" "$f" && wl-copy --type image/png < "$f"'
